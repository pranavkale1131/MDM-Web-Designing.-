<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
  <main class="mx-auto max-w-4xl p-4 sm:p-8">
    <header class="mb-8">
      <p class="text-sm font-semibold uppercase tracking-widest text-indigo-600">Personal Finance</p>
      <h1 class="mt-2 text-3xl font-bold sm:text-4xl">Expense Tracker</h1>
      <p class="mt-2 text-slate-500">Manage your daily spending in one place.</p>
    </header>

    <section class="mb-6 grid gap-4 sm:grid-cols-2">
      <div class="rounded-2xl bg-indigo-600 p-6 text-white shadow">
        <p class="text-sm text-indigo-100">Total Expenses</p>
        <p id="total" class="mt-2 text-3xl font-bold">₹0.00</p>
      </div>
      <div class="rounded-2xl bg-white p-6 shadow">
        <p class="text-sm text-slate-500">Number of Expenses</p>
        <p id="count" class="mt-2 text-3xl font-bold">0</p>
      </div>
    </section>

    <section class="mb-6 rounded-2xl bg-white p-6 shadow">
      <h2 class="mb-4 text-xl font-bold">Add New Expense</h2>
      <form id="expenseForm" class="grid gap-3 sm:grid-cols-2">
        <input id="expenseName" class="rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500" placeholder="Expense name" required maxlength="50">
        <input id="amount" type="number" min="0.01" step="0.01" class="rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500" placeholder="Amount (₹)" required>
        <select id="category" class="rounded-lg border border-slate-300 bg-white px-4 py-3 sm:col-span-2">
          <option>Food</option><option>Travel</option><option>Shopping</option><option>Education</option><option>Other</option>
        </select>
        <button class="rounded-lg bg-indigo-600 px-5 py-3 font-semibold text-white transition hover:bg-indigo-700 sm:col-span-2">Add Expense</button>
      </form>
    </section>

    <section class="rounded-2xl bg-white p-6 shadow">
      <div class="mb-4 flex items-center justify-between">
        <h2 class="text-xl font-bold">Recent Expenses</h2>
        <button id="clearAll" class="text-sm font-semibold text-red-600 hover:underline">Clear all</button>
      </div>
      <div id="expenseList" class="space-y-3">
        <p id="emptyMessage" class="py-8 text-center text-slate-400">No expenses yet. Add your first expense!</p>
      </div>
    </section>
    <p class="mt-6 text-center text-xs text-slate-400">Expense Tracker • Built with HTML, Tailwind CSS and JavaScript</p>
  </main>

  <script>
    const form = document.getElementById('expenseForm');
    const list = document.getElementById('expenseList');
    const totalEl = document.getElementById('total');
    const countEl = document.getElementById('count');
    const emptyMessage = document.getElementById('emptyMessage');
    let expenses = JSON.parse(localStorage.getItem('expenses') || '[]');

    function saveExpenses() {
      localStorage.setItem('expenses', JSON.stringify(expenses));
      renderExpenses();
    }

    function renderExpenses() {
      list.innerHTML = '';
      const total = expenses.reduce((sum, item) => sum + item.amount, 0);
      totalEl.textContent = total.toLocaleString('en-IN', {style:'currency', currency:'INR'});
      countEl.textContent = expenses.length;

      if (expenses.length === 0) {
        const msg = document.createElement('p');
        msg.className = 'py-8 text-center text-slate-400';
        msg.textContent = 'No expenses yet. Add your first expense!';
        list.appendChild(msg);
        return;
      }

      expenses.slice().reverse().forEach(item => {
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between gap-3 rounded-xl border border-slate-100 p-4';
        const details = document.createElement('div');
        const name = document.createElement('p');
        name.className = 'font-semibold';
        name.textContent = item.name;
        const meta = document.createElement('p');
        meta.className = 'mt-1 text-sm text-slate-500';
        meta.textContent = item.category + ' • ' + item.date;
        details.append(name, meta);

        const right = document.createElement('div');
        right.className = 'flex items-center gap-3';
        const price = document.createElement('span');
        price.className = 'font-bold';
        price.textContent = item.amount.toLocaleString('en-IN', {style:'currency', currency:'INR'});
        const del = document.createElement('button');
        del.className = 'rounded-lg px-2 py-1 text-sm font-semibold text-red-600 hover:bg-red-50';
        del.textContent = 'Delete';
        del.setAttribute('aria-label', 'Delete ' + item.name);
        del.addEventListener('click', () => {
          expenses = expenses.filter(expense => expense.id !== item.id);
          saveExpenses();
        });
        right.append(price, del);
        row.append(details, right);
        list.appendChild(row);
      });
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      const name = document.getElementById('expenseName').value.trim();
      const amount = Number(document.getElementById('amount').value);
      const category = document.getElementById('category').value;
      if (!name || !Number.isFinite(amount) || amount <= 0) return;
      expenses.push({
        id: Date.now() + Math.random(),
        name,
        amount,
        category,
        date: new Date().toLocaleDateString('en-IN')
      });
      form.reset();
      saveExpenses();
    });

    document.getElementById('clearAll').addEventListener('click', () => {
      if (expenses.length && confirm('Delete all expenses?')) {
        expenses = [];
        saveExpenses();
      }
    });

    renderExpenses();
  </script>
</body>
</html>
